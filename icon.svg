<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="50%" stop-color="#4b7be5"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="cat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 猫仔举哑铃 -->
  <g transform="translate(256,268)">
    <!-- 尾巴 -->
    <path d="M-40,60 Q-70,50 -80,20 Q-85,0 -70,-10 Q-55,-15 -50,0" fill="none" stroke="url(#cat)" stroke-width="14" stroke-linecap="round"/>
    <!-- 身体 -->
    <ellipse cx="0" cy="40" rx="52" ry="48" fill="url(#cat)" opacity=".92"/>
    <!-- 头部 -->
    <circle cx="0" cy="-20" r="44" fill="url(#cat)" opacity=".95"/>
    <!-- 左耳 -->
    <path d="M-36,-48 L-48,-90 L-14,-50 Z" fill="url(#cat)" opacity=".95"/>
    <!-- 右耳 -->
    <path d="M36,-48 L48,-90 L14,-50 Z" fill="url(#cat)" opacity=".95"/>
    <!-- 耳内三角 -->
    <path d="M-34,-52 L-42,-78 L-18,-50 Z" fill="rgba(255,255,255,.4)"/>
    <path d="M34,-52 L42,-78 L18,-50 Z" fill="rgba(255,255,255,.4)"/>
    <!-- 眼睛 -->
    <ellipse cx="-16" cy="-22" rx="6" ry="8" fill="rgba(91,140,255,.5)"/>
    <ellipse cx="16" cy="-22" rx="6" ry="8" fill="rgba(91,140,255,.5)"/>
    <!-- 瞳孔 -->
    <ellipse cx="-16" cy="-22" rx="3" ry="5" fill="rgba(91,140,255,.8)"/>
    <ellipse cx="16" cy="-22" rx="3" ry="5" fill="rgba(91,140,255,.8)"/>
    <!-- 鼻子 -->
    <path d="M-4,-8 L0,-4 L4,-8 Z" fill="rgba(91,140,255,.4)"/>
    <!-- 嘴巴 -->
    <path d="M0,-4 Q-12,4 -16,0" fill="none" stroke="rgba(91,140,255,.25)" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,-4 Q12,4 16,0" fill="none" stroke="rgba(91,140,255,.25)" stroke-width="2" stroke-linecap="round"/>
    <!-- 胡须 -->
    <line x1="-20" y1="-12" x2="-46" y2="-18" stroke="rgba(255,255,255,.5)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-20" y1="-8" x2="-46" y2="-6" stroke="rgba(255,255,255,.5)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="-12" x2="46" y2="-18" stroke="rgba(255,255,255,.5)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="-8" x2="46" y2="-6" stroke="rgba(255,255,255,.5)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 左手举哑铃 -->
    <path d="M-38,10 Q-58,-10 -52,-30" fill="none" stroke="url(#cat)" stroke-width="12" stroke-linecap="round"/>
    <!-- 右手举哑铃 -->
    <path d="M38,10 Q58,-10 52,-30" fill="none" stroke="url(#cat)" stroke-width="12" stroke-linecap="round"/>
    <!-- 哑铃杆 -->
    <rect x="-90" y="-52" width="180" height="18" rx="9" fill="rgba(255,255,255,.85)" filter="drop-shadow(0 3px 6px rgba(0,0,0,.12))"/>
    <!-- 左哑铃片 -->
    <rect x="-78" y="-76" width="22" height="66" rx="6" fill="rgba(255,255,255,.5)"/>
    <rect x="-70" y="-68" width="14" height="50" rx="5" fill="rgba(255,255,255,.6)"/>
    <!-- 右哑铃片 -->
    <rect x="56" y="-76" width="22" height="66" rx="6" fill="rgba(255,255,255,.5)"/>
    <rect x="56" y="-68" width="14" height="50" rx="5" fill="rgba(255,255,255,.6)"/>
  </g>
</svg>
