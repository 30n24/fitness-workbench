<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="50%" stop-color="#4b7be5"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,.95)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,.85)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,.95)"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 杠铃 - 45度视角，简洁现代 -->
  <g transform="translate(256,256) rotate(-30)">
    <!-- 杠铃杆 -->
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="url(#bar)" filter="drop-shadow(0 4px 8px rgba(0,0,0,.15))"/>
    <!-- 左端配重片 -->
    <g>
      <rect x="-176" y="-60" width="40" height="120" rx="10" fill="rgba(255,255,255,.45)"/>
      <rect x="-168" y="-48" width="24" height="96" rx="8" fill="rgba(255,255,255,.55)"/>
      <rect x="-160" y="-36" width="12" height="72" rx="6" fill="rgba(255,255,255,.7)"/>
    </g>
    <!-- 右端配重片 -->
    <g>
      <rect x="136" y="-60" width="40" height="120" rx="10" fill="rgba(255,255,255,.45)"/>
      <rect x="144" y="-48" width="24" height="96" rx="8" fill="rgba(255,255,255,.55)"/>
      <rect x="148" y="-36" width="12" height="72" rx="6" fill="rgba(255,255,255,.7)"/>
    </g>
    <!-- 中间训练区高光 -->
    <rect x="-60" y="-24" width="120" height="48" rx="24" fill="rgba(255,255,255,.15)"/>
  </g>
</svg>
