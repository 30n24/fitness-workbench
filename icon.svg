<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="40%" stop-color="#4b7be5"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="cat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dceeff"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cce7ff"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- 主体：猫头 + 肌肉身材 + 哑铃 -->
  <g transform="translate(256,256)">
    <!-- === 肌肉身材剪影（bodybuilder 体型）=== -->
    <!-- 肩膀+胸肌（宽阔 V 形上身） -->
    <path d="M-90,-10 C-95,-10 -98,-5 -98,0 C-94,18 -82,30 -62,32 L-60,32 C-58,18 -56,4 -54,-12 L-54,-12 C-54,-12 -72,-14 -90,-10 Z" fill="url(#body)" opacity=".95"/>
    <path d="M90,-10 C95,-10 98,-5 98,0 C94,18 82,30 62,32 L60,32 C58,18 56,4 54,-12 L54,-12 C54,-12 72,-14 90,-10 Z" fill="url(#body)" opacity=".95"/>
    <!-- 上身躯干（胸+腹） -->
    <path d="M-58,-12 C-58,18 -54,40 -44,56 L44,56 C54,40 58,18 58,-12 C58,-14 30,-22 0,-22 C-30,-22 -58,-14 -58,-12 Z" fill="url(#body)" opacity=".95"/>
    <!-- 腹肌线条提示（浅浅分隔） -->
    <line x1="0" y1="6" x2="0" y2="40" stroke="rgba(91,140,255,.15)" stroke-width="1.5"/>
    <line x1="-26" y1="14" x2="-26" y2="40" stroke="rgba(91,140,255,.15)" stroke-width="1.5"/>
    <line x1="26" y1="14" x2="26" y2="40" stroke="rgba(91,140,255,.15)" stroke-width="1.5"/>
    <!-- 胸部线条 -->
    <path d="M-30,-2 Q-15,2 0,-2" stroke="rgba(91,140,255,.2)" stroke-width="1.5" fill="none"/>
    <path d="M0,-2 Q15,2 30,-2" stroke="rgba(91,140,255,.2)" stroke-width="1.5" fill="none"/>
    <!-- 左手垂下有肌肉感 -->
    <path d="M-90,-2 C-100,8 -104,22 -100,40 C-98,52 -90,58 -82,52 C-78,38 -78,22 -82,8 Z" fill="url(#body)" opacity=".95"/>
    <!-- 右手举起撑哑铃（粗壮肱二头肌） -->
    <path d="M90,-2 C100,8 108,22 110,36 L92,38 C84,28 80,16 82,4 Z" fill="url(#body)" opacity=".95"/>
    <!-- 继续撑哑铃嘅前臂向上 -->
    <path d="M92,38 C102,28 110,12 108,-8 L92,-8 C88,4 84,18 82,32 Z" fill="url(#body)" opacity=".95"/>
    <path d="M108,-8 L120,-30 L132,-22 L116,0 Z" fill="url(#body)" opacity=".95"/>

    <!-- === 猫头（圆头 + 大眼 + 微笑 — 参考图风格）=== -->
    <!-- 猫耳（三角形 + 内耳） -->
    <path d="M-46,-58 L-58,-100 L-26,-66 Z" fill="url(#cat)"/>
    <path d="M46,-58 L58,-100 L26,-66 Z" fill="url(#cat)"/>
    <path d="M-44,-62 L-52,-90 L-32,-66 Z" fill="rgba(255,255,255,.5)"/>
    <path d="M44,-62 L52,-90 L32,-66 Z" fill="rgba(255,255,255,.5)"/>
    <!-- 圆脸（带蓬松起伏） -->
    <path d="M-50,-30 C-58,-50 -54,-78 -42,-86 C-30,-92 -22,-88 -16,-78 C-10,-86 10,-86 16,-78 C22,-88 30,-92 42,-86 C54,-78 58,-50 50,-30 C58,-12 56,8 46,18 C36,28 22,32 8,30 C-8,32 -22,32 -36,28 C-46,28 -56,18 -58,8 C-58,-12 -56,-22 -50,-30 Z" fill="url(#cat)"/>
    <!-- 蓬松细毛（脸颊下边） -->
    <path d="M-52,12 Q-50,18 -46,22" fill="none" stroke="url(#cat)" stroke-width="3" stroke-linecap="round" opacity=".6"/>
    <path d="M52,12 Q50,18 46,22" fill="none" stroke="url(#cat)" stroke-width="3" stroke-linecap="round" opacity=".6"/>
    <!-- 大圆眼（参考图风格） -->
    <ellipse cx="-22" cy="-30" rx="11" ry="14" fill="#ffffff" stroke="rgba(91,140,255,.6)" stroke-width="2"/>
    <ellipse cx="22" cy="-30" rx="11" ry="14" fill="#ffffff" stroke="rgba(91,140,255,.6)" stroke-width="2"/>
    <!-- 瞳孔（蓝色大眼） -->
    <ellipse cx="-22" cy="-26" rx="7" ry="10" fill="rgba(91,140,255,.7)"/>
    <ellipse cx="22" cy="-26" rx="7" ry="10" fill="rgba(91,140,255,.7)"/>
    <!-- 眼睛高光 -->
    <ellipse cx="-20" cy="-32" rx="2.5" ry="3" fill="#ffffff"/>
    <ellipse cx="24" cy="-32" rx="2.5" ry="3" fill="#ffffff"/>
    <ellipse cx="-24" cy="-22" rx="1.5" ry="1.5" fill="#ffffff" opacity=".7"/>
    <ellipse cx="20" cy="-22" rx="1.5" ry="1.5" fill="#ffffff" opacity=".7"/>
    <!-- 小鼻子 -->
    <path d="M-4,-12 L0,-6 L4,-12 Z" fill="rgba(91,140,255,.5)"/>
    <!-- 微笑 -->
    <path d="M-8,-4 Q0,8 8,-4" fill="none" stroke="rgba(91,140,255,.5)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 胡须 -->
    <path d="M-22,-12 L-46,-14 M-22,-8 L-46,-6 M-22,-4 L-44,0" stroke="rgba(255,255,255,.5)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M22,-12 L46,-14 M22,-8 L46,-6 M22,-4 L44,0" stroke="rgba(255,255,255,.5)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- === 哑铃（右手举过头顶，斜上方） === -->
    <g transform="translate(40,-58) rotate(-15)">
      <rect x="-46" y="-8" width="92" height="14" rx="7" fill="rgba(255,255,255,.95)" filter="drop-shadow(0 2px 4px rgba(0,0,0,.12))"/>
      <rect x="-40" y="-22" width="14" height="42" rx="5" fill="rgba(255,255,255,.55)"/>
      <rect x="26" y="-22" width="14" height="42" rx="5" fill="rgba(255,255,255,.55)"/>
      <rect x="-36" y="-18" width="9" height="34" rx="4" fill="rgba(255,255,255,.65)"/>
      <rect x="27" y="-18" width="9" height="34" rx="4" fill="rgba(255,255,255,.65)"/>
    </g>
  </g>
</svg>