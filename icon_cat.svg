<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="40%" stop-color="#4b7be5"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- 圆角渐变背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- 图二风格猫头 — 手绘线稿感、蓬松边缘、大圆眼、微笑 -->
  <g transform="translate(260,248)">
    <!-- 左耳（尖三角 + 内部） -->
    <path d="M-58,-38 L-82,-104 L-26,-58 Z" fill="#fff" opacity=".92"/>
    <path d="M-54,-44 L-72,-88 L-34,-58 Z" fill="rgba(255,255,255,.45)"/>
    <!-- 右耳（尖三角 + 内部） -->
    <path d="M58,-38 L82,-104 L26,-58 Z" fill="#fff" opacity=".92"/>
    <path d="M54,-44 L72,-88 L34,-58 Z" fill="rgba(255,255,255,.45)"/>
    <!-- 猫脸 — 圆澎蓬松感（锯齿状边缘模拟绒毛） -->
    <path d="
      M0,-96
      C-18,-92 -26,-90 -34,-84
      Q-38,-80 -40,-72
      C-50,-72 -58,-64 -64,-52
      Q-68,-46 -70,-36
      C-80,-24 -90,-14 -92,0
      C-94,14 -90,22 -82,30
      Q-78,36 -70,40
      C-62,54 -52,62 -38,68
      Q-26,72 -14,70
      C-8,72 0,72 8,70
      Q20,72 32,68
      C46,62 56,54 64,40
      Q72,36 76,30
      C84,22 88,14 86,0
      C84,-14 74,-24 64,-36
      Q60,-46 56,-52
      C48,-64 38,-72 26,-72
      Q24,-80 18,-86
      C12,-90 6,-92 0,-96 Z
    " fill="#ffffff" opacity=".95"/>
    <!-- 绒毛细节补充（耳旁、下巴两侧） -->
    <path d="M-42,-64 L-38,-70 M-34,-64 L-30,-70" stroke="rgba(255,255,255,.6)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M42,-64 L38,-70 M34,-64 L30,-70" stroke="rgba(255,255,255,.6)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-76,-6 L-82,-2 M-72,4 L-78,6" stroke="rgba(255,255,255,.6)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M76,-6 L82,-2 M72,4 L78,6" stroke="rgba(255,255,255,.6)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 眼部区域底色（轻微加深） -->
    <ellipse cx="-28" cy="-10" rx="20" ry="22" fill="rgba(255,255,255,.5)"/>
    <ellipse cx="28" cy="-10" rx="20" ry="22" fill="rgba(255,255,255,.5)"/>
    <!-- 大圆眼（参考图二） -->
    <ellipse cx="-28" cy="-10" rx="16" ry="19" fill="#ffffff"/>
    <ellipse cx="28" cy="-10" rx="16" ry="19" fill="#ffffff"/>
    <!-- 眼线（手绘感） -->
    <path d="M-44,-10 C-40,-28 -16,-28 -12,-10" fill="none" stroke="rgba(91,140,255,.4)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M12,-10 C16,-28 40,-28 44,-10" fill="none" stroke="rgba(91,140,255,.4)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 瞳孔 -->
    <circle cx="-28" cy="-6" r="10" fill="rgba(91,140,255,.7)"/>
    <circle cx="28" cy="-6" r="10" fill="rgba(91,140,255,.7)"/>
    <!-- 瞳孔高光 -->
    <circle cx="-32" cy="-12" r="3.5" fill="#ffffff"/>
    <circle cx="24" cy="-12" r="3.5" fill="#ffffff"/>
    <circle cx="-24" cy="-2" r="1.8" fill="#ffffff" opacity=".7"/>
    <circle cx="32" cy="-2" r="1.8" fill="#ffffff" opacity=".7"/>
    <!-- 小鼻子（正三角形） -->
    <path d="M-5,12 L0,18 L5,12 Z" fill="rgba(91,140,255,.45)"/>
    <!-- 微笑 -->
    <path d="M-10,18 Q0,30 10,18" fill="none" stroke="rgba(91,140,255,.5)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 胡须 -->
    <path d="M-26,12 L-58,8 M-26,16 L-58,16 M-26,20 L-56,24" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-linecap="round"/>
    <path d="M26,12 L58,8 M26,16 L58,16 M26,20 L56,24" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>